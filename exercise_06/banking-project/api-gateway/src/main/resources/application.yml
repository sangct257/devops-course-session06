server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            server:
                webflux:
                    routes:
                        - id: account-service
                          uri: http://account-service:8080
                          predicates:
                              - Path=/api/v1/accounts/**
                          filters:
                              - RewritePath=/api/v1/(?<segment>.*), /api/${segment}

                        - id: transaction-service
                          uri: http://transaction-service:8081
                          predicates:
                              - Path=/api/v1/transactions/**
                          filters:
                              - RewritePath=/api/v1/(?<segment>.*), /api/${segment}